name: Test
on: [push, pull_request]
jobs:
  Assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Check out integration test repository
        uses: actions/checkout@v4
        with:
          repository: openmf/ph-ee-connector-integration-test
          path: ph-ee-connector-integration-test
      # The runner default JDK is not 21; without this step the build fails on
      # `sourceCompatibility = 21` with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Assemble project
        run: ./gradlew clean build
      - name: Build Docker image
        run: docker build . -t paymenthubee.mifos.io/phee/connector-channel
      
